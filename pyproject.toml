[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "oman_vat"
version = "0.2.0"
description = "Oman VAT controls and return preparation for ERPNext v16"
authors = [{name = "Oman VAT contributors"}]
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}

[project.urls]
Repository = "https://github.com/thinknxg/Oman-Fatwara"
Issues = "https://github.com/thinknxg/Oman-Fatwara/issues"

[tool.bench.frappe-dependencies]
frappe = ">=16.50.0,<17.0.0"
erpnext = ">=16.50.0,<17.0.0"

[tool.flit.sdist]
include = ["oman_vat/", "tests/", "docs/", "license.txt"]
